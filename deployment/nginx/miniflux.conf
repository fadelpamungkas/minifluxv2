# Nginx Configuration for Miniflux with Path Prefix
# 
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/miniflux
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/miniflux /etc/nginx/sites-enabled/
#   3. Test configuration: sudo nginx -t
#   4. Reload Nginx: sudo systemctl reload nginx
#
# SSL Setup:
#   After installation, run: sudo certbot --nginx -d YOUR_DOMAIN
#   Certbot will automatically update this configuration with SSL certificates

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain
    server_name 38264e67-5d48-4757-85a4-6985d9aa491a.svc.dalang.io;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Replace with your actual domain
    server_name 38264e67-5d48-4757-85a4-6985d9aa491a.svc.dalang.io;
    
    # SSL Certificate Configuration
    # These paths will be automatically configured by certbot
    # After running certbot, these will be populated:
    ssl_certificate /etc/letsencrypt/live/38264e67-5d48-4757-85a4-6985d9aa491a.svc.dalang.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/38264e67-5d48-4757-85a4-6985d9aa491a.svc.dalang.io/privkey.pem;
    
    # SSL Configuration (modern, secure settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/miniflux-access.log;
    error_log /var/log/nginx/miniflux-error.log;
    
    # Max upload size (for OPML imports, etc.)
    client_max_body_size 10M;
    
    # ============================================
    # Miniflux Location Block
    # ============================================
    # Routes /miniflux/* to Miniflux backend
    location /miniflux {
        # Proxy to Miniflux backend (running on localhost:8080)
        proxy_pass http://127.0.0.1:8080;
        
        # Essential proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed for future features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # ============================================
    # Additional Services
    # ============================================
    # Add more location blocks here for other services
    # Example:
    # location /service2 {
    #     proxy_pass http://127.0.0.1:8082;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # ============================================
    # Root Location (Optional)
    # ============================================
    # If you want a default page or redirect root to /miniflux:
    location = / {
        return 301 https://$server_name/miniflux;
    }
    
    # Health check endpoint (if needed)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
