# PostgreSQL Configuration Snippet
# Resource-Optimized Settings for 1GB RAM Server
#
# This file contains PostgreSQL settings optimized for low-memory environments.
# These settings should be added to your PostgreSQL configuration file.
#
# Location of PostgreSQL config file:
#   - Ubuntu/Debian: /etc/postgresql/15/main/postgresql.conf
#   - CentOS/RHEL: /var/lib/pgsql/15/data/postgresql.conf
#
# After modifying, restart PostgreSQL: sudo systemctl restart postgresql

# ============================================
# Memory Settings (Critical for 1GB RAM)
# ============================================

# Shared buffers - memory used for caching data
# Default: 128MB → Reduced to 32MB
shared_buffers = 32MB

# Work memory - memory for each query operation (sorts, hashes, etc.)
# Default: 4MB → Reduced to 2MB
work_mem = 2MB

# Maintenance work memory - memory for maintenance operations (VACUUM, CREATE INDEX, etc.)
# Default: 64MB → Reduced to 16MB
maintenance_work_mem = 16MB

# Effective cache size - estimate of OS cache available
# Set to about 50% of available RAM for 1GB server
effective_cache_size = 512MB

# ============================================
# Connection Settings
# ============================================

# Maximum number of concurrent connections
# Default: 100 → Reduced to 20 (sufficient for Miniflux)
max_connections = 20

# ============================================
# Query Planner Settings
# ============================================

# Random page cost - adjust for SSD (lower value favors index scans)
# Default: 4.0 → Reduced to 1.1 for SSD
random_page_cost = 1.1

# Effective IO concurrency - number of concurrent I/O operations
# Set to 2 for SSD
effective_io_concurrency = 2

# ============================================
# Write-Ahead Logging (WAL) Settings
# ============================================

# WAL buffer size
# Default: 16MB → Reduced to 4MB
wal_buffers = 4MB

# Checkpoint settings - balance between performance and recovery time
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ============================================
# Logging Settings (Optional)
# ============================================

# Uncomment to enable query logging (useful for debugging, but uses disk space)
# log_statement = 'all'
# log_duration = on
# log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Log slow queries (queries taking longer than 1 second)
# log_min_duration_statement = 1000

# ============================================
# Performance Tuning
# ============================================

# Disable unnecessary features to save resources
# These are safe to disable for Miniflux use case
default_statistics_target = 50
constraint_exclusion = partition

# ============================================
# Notes
# ============================================
# - These settings are optimized for a 1GB RAM server running Miniflux
# - If you have more RAM available, you can increase shared_buffers and work_mem
# - Monitor PostgreSQL memory usage: SELECT * FROM pg_stat_activity;
# - Check PostgreSQL logs: sudo tail -f /var/log/postgresql/postgresql-15-main.log
