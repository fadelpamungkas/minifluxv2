# Miniflux Configuration File
# See https://miniflux.app/docs/configuration.html for all available options
# This file is loaded by systemd service via EnvironmentFile directive

# Database Configuration
# Format: postgres://username:password@host:port/database?sslmode=disable
# IMPORTANT: Update the password before deployment!
DATABASE_URL=postgres://miniflux:secret_pass@localhost/miniflux?sslmode=disable

# Run database migrations automatically on startup
RUN_MIGRATIONS=1

# Base URL Configuration
# IMPORTANT: Must include the full path prefix (/miniflux) for reverse proxy setup
# Replace with your actual domain before deployment
BASE_URL=https://38264e67-5d48-4757-85a4-6985d9aa491a.svc.dalang.io/miniflux

# Listen Address
# Bind to localhost only - Nginx reverse proxy will handle external access
LISTEN_ADDR=127.0.0.1:8080

# RSS Bridge Integration (optional)
# If you're using RSS-Bridge, uncomment and update the URL
# RSS_BRIDGE_URL=http://localhost:8081

# ============================================
# RESOURCE OPTIMIZATION FOR 1GB RAM SERVER
# ============================================
# These settings are optimized for low-memory environments

# Worker Pool Size
# Default: 16 → Reduced to 2 (most impactful for memory usage!)
WORKER_POOL_SIZE=2

# Batch Size
# Default: 100 → Reduced to 10 feeds per batch
BATCH_SIZE=10

# Database Connection Pool
# Default: 20 max connections → Reduced to 5
DATABASE_MAX_CONNS=5
DATABASE_MIN_CONNS=1

# Polling Frequency
# Default: 60 minutes → Increased to 120 minutes between auto-refreshes
# This reduces CPU and network usage
POLLING_FREQUENCY=120

# ============================================
# OPTIONAL: Admin User Creation
# ============================================
# Uncomment these to create an admin user on first run
# CREATE_ADMIN=1
# ADMIN_USERNAME=admin
# ADMIN_PASSWORD=change_this_password

# ============================================
# OPTIONAL: Logging Configuration
# ============================================
# LOG_DATE_TIME=1
# LOG_LEVEL=info
# LOG_FORMAT=json

# ============================================
# OPTIONAL: Additional Settings
# ============================================
# See https://miniflux.app/docs/configuration.html for more options
# - HTTPS configuration
# - OAuth providers
# - Media proxy settings
